<svg viewBox="0 0 1120 620" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
    .title { fill: #e2e8f0; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 10px; }
    .label { fill: #f8fafc; font-size: 11px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #94a3b8; font-size: 9px; text-anchor: middle; }
    .tiny { fill: #cbd5e1; font-size: 8px; text-anchor: middle; }
    .region { fill: none; stroke: #fbbf24; stroke-width: 1; stroke-dasharray: 8 4; }
    .region-label { fill: #fbbf24; font-size: 9px; font-weight: 600; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="1120" height="620" fill="#0f172a"/>
  <rect width="1120" height="620" fill="url(#grid)"/>

  <text x="36" y="42" class="title">trading-agent-rs multi-agent trading-analysis pipeline</text>
  <text x="36" y="60" class="subtitle">Native Rust orchestration, Yahoo Finance tools, LLM analyst debate, and Markdown report output</text>

  <rect x="32" y="92" width="1056" height="138" rx="12" class="region"/>
  <text x="48" y="112" class="region-label">Input and data acquisition</text>
  <rect x="32" y="260" width="1056" height="168" rx="12" class="region"/>
  <text x="48" y="280" class="region-label">Agent graph</text>
  <rect x="32" y="458" width="1056" height="98" rx="12" class="region"/>
  <text x="48" y="478" class="region-label">Output</text>

  <path d="M 170 160 L 264 160" fill="none" stroke="#22d3ee" stroke-width="1.8" marker-end="url(#arrow-cyan)"/>
  <path d="M 428 160 L 522 160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 720 160 L 810 160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 880 210 L 880 296" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M 190 356 L 272 356" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M 432 356 L 514 356" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M 674 356 L 756 356" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M 916 356 L 996 356" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M 1036 398 L 1036 498 L 860 498" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="128" width="120" height="64" rx="8" fill="#0f172a"/>
    <rect x="50" y="128" width="120" height="64" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="110" y="154" class="label">CLI</text>
    <text x="110" y="171" class="sub">tickers + date</text>
  </g>

  <g>
    <rect x="264" y="128" width="164" height="64" rx="8" fill="#0f172a"/>
    <rect x="264" y="128" width="164" height="64" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="346" y="154" class="label">Config</text>
    <text x="346" y="171" class="sub">provider, models, concurrency</text>
  </g>

  <g>
    <rect x="522" y="118" width="198" height="84" rx="8" fill="#0f172a"/>
    <rect x="522" y="118" width="198" height="84" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="621" y="145" class="label">Yahoo Finance tools</text>
    <text x="621" y="163" class="sub">prices, indicators, fundamentals</text>
    <text x="621" y="180" class="sub">news and sentiment inputs</text>
  </g>

  <g>
    <rect x="810" y="118" width="140" height="84" rx="8" fill="#0f172a"/>
    <rect x="810" y="118" width="140" height="84" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="880" y="145" class="label">LLM clients</text>
    <text x="880" y="163" class="sub">quick + deep</text>
    <text x="880" y="180" class="sub">provider adapters</text>
  </g>

  <g>
    <rect x="70" y="312" width="120" height="88" rx="8" fill="#0f172a"/>
    <rect x="70" y="312" width="120" height="88" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="130" y="338" class="label">Analysts</text>
    <text x="130" y="356" class="sub">market</text>
    <text x="130" y="372" class="sub">news</text>
    <text x="130" y="388" class="sub">fundamentals</text>
  </g>

  <g>
    <rect x="272" y="312" width="160" height="88" rx="8" fill="#0f172a"/>
    <rect x="272" y="312" width="160" height="88" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="352" y="338" class="label">Research debate</text>
    <text x="352" y="356" class="sub">bull researcher</text>
    <text x="352" y="372" class="sub">bear researcher</text>
    <text x="352" y="388" class="sub">manager synthesis</text>
  </g>

  <g>
    <rect x="514" y="312" width="160" height="88" rx="8" fill="#0f172a"/>
    <rect x="514" y="312" width="160" height="88" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="594" y="338" class="label">Trader</text>
    <text x="594" y="356" class="sub">action plan</text>
    <text x="594" y="372" class="sub">entry/exit logic</text>
    <text x="594" y="388" class="sub">position framing</text>
  </g>

  <g>
    <rect x="756" y="312" width="160" height="88" rx="8" fill="#0f172a"/>
    <rect x="756" y="312" width="160" height="88" rx="8" fill="rgba(136,19,55,0.4)" stroke="#fb7185" stroke-width="1.5"/>
    <text x="836" y="338" class="label">Risk debate</text>
    <text x="836" y="356" class="sub">risky</text>
    <text x="836" y="372" class="sub">safe</text>
    <text x="836" y="388" class="sub">neutral analysts</text>
  </g>

  <g>
    <rect x="996" y="312" width="76" height="88" rx="8" fill="#0f172a"/>
    <rect x="996" y="312" width="76" height="88" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="1034" y="340" class="label">PM</text>
    <text x="1034" y="358" class="sub">final</text>
    <text x="1034" y="374" class="sub">decision</text>
  </g>

  <g>
    <rect x="650" y="474" width="210" height="58" rx="8" fill="#0f172a"/>
    <rect x="650" y="474" width="210" height="58" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="755" y="498" class="label">Markdown report</text>
    <text x="755" y="515" class="sub">reports/&lt;TICKER&gt;_&lt;DATE&gt;.md</text>
  </g>

  <g>
    <rect x="84" y="488" width="18" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee"/>
    <text x="152" y="497" class="tiny">CLI / user-facing</text>
    <rect x="84" y="510" width="18" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399"/>
    <text x="152" y="519" class="tiny">analysis / processing</text>
    <rect x="260" y="488" width="18" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa"/>
    <text x="330" y="497" class="tiny">LLM / synthesis</text>
    <rect x="260" y="510" width="18" height="10" rx="2" fill="rgba(136,19,55,0.4)" stroke="#fb7185"/>
    <text x="330" y="519" class="tiny">risk review</text>
  </g>
</svg>
